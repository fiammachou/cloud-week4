apiVersion: apps/v1
kind: Deployment
metadata:
  name: week4-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week4-backend
  template:
    metadata:
      labels:
        app: week4-backend
    spec:
      containers:
        - name: backend
          image: fivich/lemp-backend:1.0.0
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: week4-app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: week4-app-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: week4-app-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: week4-db-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 8000